name: Deploy EEG Pretraining Atlas to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate data and ranking logic
        run: node --test tests/core.test.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Collect static website files
        run: |
          mkdir -p public
          cp index.html styles.css app.js core.js config.js .nojekyll public/
          cp -r data assets public/
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

